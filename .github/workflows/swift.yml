name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROJECT_NAME: MacOSClone
      TARGET_NAME: MacOSClone
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        shell: bash
        run: |
          set -euxo pipefail
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator' || true

      - name: Build simulator
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -target "${TARGET_NAME}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData/sim" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build device
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -target "${TARGET_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath "$RUNNER_TEMP/DerivedData/device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          DEV_APP_PATH="$(find "$RUNNER_TEMP/DerivedData/device" -path '*Build/Products/Release-iphoneos/*.app' -type d | head -n 1)"
          test -d "$DEV_APP_PATH"
          test -f "$DEV_APP_PATH/Info.plist"

          lipo -info "$DEV_APP_PATH/$(basename "$DEV_APP_PATH")" | grep -q arm64

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          rm -rf "$RUNNER_TEMP/ipa/Payload/MacOSClone.app"
          cp -R "$DEV_APP_PATH" "$RUNNER_TEMP/ipa/Payload/MacOSClone.app"

          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/MacOSClone-unsigned.ipa" Payload)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOSClone-iOS-artifacts
          path: |
            ${{ runner.temp }}/DerivedData/sim/**/Build/Products/Release-iphonesimulator/*.app
            MacOSClone-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
